name: Feature request
description: Suggest an idea or improvement for Ultimate Updater
labels: [feature-request]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve? For example, "I'm always frustrated when ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other solutions or workarounds you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, examples, or links.
