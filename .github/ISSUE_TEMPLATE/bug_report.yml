name: Bug report
description: Report a reproducible problem with Ultimate Updater
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please remove passwords,
        private keys, tokens, and other credentials from everything you paste.
        Report security vulnerabilities privately as described in SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `update` with ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Ultimate Updater version
      description: Output of `update status`.
      render: text
    validations:
      required: true
  - type: input
    id: pve-version
    attributes:
      label: Proxmox VE version
      description: Output of `pveversion`.
      placeholder: pve-manager/9.1.9/...
    validations:
      required: true
  - type: dropdown
    id: target-type
    attributes:
      label: Affected target type
      multiple: true
      options:
        - Proxmox host
        - LXC container
        - VM (QEMU Guest Agent)
        - VM (SSH)
        - External system (SSH)
        - Web UI
        - Installer / self-update
    validations:
      required: true
  - type: input
    id: guest-os
    attributes:
      label: Guest operating system
      description: Distribution and version of the affected container or VM, if any.
      placeholder: Debian 13, Ubuntu 24.04, Alpine 3.22, ...
  - type: textarea
    id: debug-output
    attributes:
      label: Debug output
      description: Set `DEBUG="true"` in `/etc/ultimate-updater/update.conf`, run the command again, and paste the relevant output.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, configuration excerpts, or anything else that helps.
